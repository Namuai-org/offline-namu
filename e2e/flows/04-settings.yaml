appId: org.namuai.offline.internal
---
- launchApp
# PA-007: Settings is reached from the drawer; each General row opens a choice list.
- tapOn:
    id: "chat-menu"
- tapOn:
    id: "drawer-settings"
- assertVisible:
    id: "settings-screen"
- tapOn:
    id: "settings-appearance"
- tapOn:
    id: "settings-theme-dark"
- tapOn:
    id: "settings-app-language"
- tapOn:
    id: "settings-language-fr"
- assertVisible: "Réglages"
- tapOn:
    id: "settings-app-language"
- tapOn:
    id: "settings-language-ha"
- assertVisible: "Saituna"
- tapOn:
    id: "settings-app-language"
- tapOn:
    id: "settings-language-en"
- scrollUntilVisible:
    element:
      id: "settings-storage"
- tapOn:
    id: "settings-storage"
- assertVisible:
    id: "storage-status"
- back
- scrollUntilVisible:
    element:
      id: "settings-privacy"
- tapOn:
    id: "settings-privacy"
- assertVisible:
    id: "privacy-screen"
- back
- scrollUntilVisible:
    element:
      id: "settings-help"
- tapOn:
    id: "settings-help"
- tapOn:
    id: "help-topic-heat"
- back
- scrollUntilVisible:
    element:
      id: "settings-about"
- tapOn:
    id: "settings-about"
- assertVisible: "Tiny Aya Global"
- assertVisible: "Cohere Labs"
- tapOn:
    id: "about-license"
- assertVisible:
    id: "legal-screen"
